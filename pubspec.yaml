name: scanvault
description: "ScanVault - Personal Offline Document Scanner and PDF Utility"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.4.1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  image: ^4.3.0
  pdf: ^3.11.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1
  google_mlkit_text_recognition: ^0.14.0
  printing: ^5.13.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
