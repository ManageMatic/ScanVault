: "600" }] } } } };</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><div class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/80 backdrop-blur-xl"><div class="h-6 px-margin flex items-center justify-between text-on-surface-variant select-none"><span class="font-label-sm text-label-sm font-semibold tracking-wider">09:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[15px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col relative w-full pt-6 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg select-none">

<div class="pin-dot w-3.5 h-3.5 rounded-full bg-primary shadow-sm transition-all duration-200"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full bg-primary shadow-sm transition-all duration-200"></div>
<div class="pin-dot relative flex items-center justify-center w-3.5 h-3.5">
<span class="absolute inline-flex h-full w-full rounded-full bg-primary/30 animate-ping"></span>
<span class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-200"></span>
</div>

</button>

<!-- Ergonomic Android Dialer Keypad -->
<div class="grid grid-cols-3 gap-y-2 gap-x-5 max-w-[320px] mx-auto w-full mt-1 mb-space-sm place-items-center">
<!-- Key 1 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">1</span>

</button>
<!-- Key 2 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">

</button>
<!-- Key 3 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">3</span>

</button>
<!-- Key 4 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">4</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-surface-variant uppercase font-medium">GHI</span>
</button>
<!-- Key 5 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">5</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-surface-variant uppercase font-medium">JKL</span>
</button>
<!-- Key 6 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">6</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-surface-variant uppercase font-medium">MNO</span>
</button>
<!-- Key 7 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">7</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-surface-variant uppercase font-medium">PQRS</span>
</button>
<!-- Key 8 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">8</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-surface-variant uppercase font-medium">TUV</span>
</button>
<!-- Key 9 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">9</span>

</button>
<!-- Key Bottom Left (Biometric shortcut) -->
<button class="flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-low active:bg-surface-container-highest active:scale-95 transition-all text-primary" id="quickBioKey" type="button">
<span class="material-symbols-outlined text-[26px]">fingerprint</span>
</button>
<!-- Key 0 -->
<button class="keypad-btn flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-lowest shadow-sm active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" type="button">
<span class="font-headline-sm text-headline-sm leading-none font-semibold">0</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-surface-variant uppercase font-medium">+</span>
</button>
<!-- Key Bottom Right (Delete) -->
<button class="flex flex-col items-center justify-center w-[72px] h-[60px] rounded-2xl bg-surface-container-low active:bg-surface-container-highest active:scale-95 transition-all text-on-surface" id="backspaceBtn" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>

<!-- Recovery Option -->
<div class="flex justify-center mt-1 mb-2">
<button class="inline-flex items-center gap-1.5 py-1 text-on-surface-variant active:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[17px]">key</span>
<span class="font-label-md text-label-md">Forgot PIN / Hardware Recovery Key</span>
</button>
</div>
<!-- Hardware Trust Security Banner -->
<div class="flex items-center justify-center gap-2 mt-auto pt-2 text-center text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[13px] text-primary">verified_user</span>
<span class="font-label-sm text-[11px] leading-tight">
      Local hardware keystore • No cloud transmission • 100% Offline
    </span>
</div>
</div>
<script>
  (function() {
    let pinCount = 4;
    const maxPin = 6;
    const container = document.getElementById('pinDotsContainer');
    const keypadButtons = document.querySelectorAll('.keypad-btn');
    const backspaceBtn = document.getElementById('backspaceBtn');
    const bioTriggers = [document.getElementById('biometricBtn'), document.getElementById('quickBioKey')];

    function renderDots() {
      if (!container) return;
      container.innerHTML = '';
      for (let i = 0; i < maxPin; i++) {
        if (i < pinCount) {
          const filledDot = document.createElement('div');
          filledDot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-primary shadow-sm transition-all duration-200';
          container.appendChild(filledDot);
        } else if (i === pinCount) {
          const activeDot = document.createElement('div');
          activeDot.className = 'pin-dot relative flex items-center justify-center w-3.5 h-3.5';
          activeDot.innerHTML = '<span class="absolute inline-flex h-full w-full rounded-full bg-primary/30 animate-ping"></span><span class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-200"></span>';
          container.appendChild(activeDot);
        } else {
          const emptyDot = document.createElement('div');
          emptyDot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-200';
          container.appendChild(emptyDot);
        }
      }
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (pinCount < maxPin) {
          pinCount++;
          renderDots();
        }
      });
    });

    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (pinCount > 0) {
          pinCount--;
          renderDots();
        }
      });
    }

    bioTriggers.forEach(btn => {
      if (btn) {
        btn.addEventListener('click', () => {
          pinCount = maxPin;
          renderDots();
          setTimeout(() => {
            pinCount = 0;
            renderDots();
          }, 450);
        });
      }
    });
  })();
</script></main></body></html>
