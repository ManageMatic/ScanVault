<!-- Micro-Interactions Script -->
<script>
    let flashState = 0; // 0: Auto, 1: On, 2: Off
    const flashIcons = ['flash_auto', 'flash_on', 'flash_off'];
    const flashColors = ['text-secondary-fixed', 'text-secondary-fixed', 'text-surface-variant'];

    function cycleFlash() {
      flashState = (flashState + 1) % 3;
      const icon = document.getElementById('flash-icon');
      icon.textContent = flashIcons[flashState];
      icon.className = `material-symbols-outlined text-[22px] ${flashColors[flashState]}`;
    }

    function toggleGrid() {
      const grid = document.getElementById('camera-grid');
      const icon = document.getElementById('grid-icon');
      if (grid.classList.contains('opacity-0')) {
        grid.classList.remove('opacity-0');
        grid.classList.add('opacity-25');
        icon.classList.remove('text-surface-variant');
      } else {
        grid.classList.remove('opacity-25');
        grid.classList.add('opacity-0');
        icon.classList.add('text-surface-variant');
      }
    }

    function setCaptureMode(mode) {
      const autoBtn = document.getElementById('mode-auto');
      const manualBtn = document.getElementById('mode-manual');

      if (mode === 'auto') {
        autoBtn.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label-md text-label-md transition-all shadow';
        autoBtn.innerHTML = '<span class="w-2 h-2 rounded-full bg-primary-fixed animate-ping"></span><span>Auto Capture</span>';
        manualBtn.className = 'px-3.5 py-1.5 rounded-full text-surface-container-high font-label-md text-label-md hover:text-surface transition-all';
      } else {
        manualBtn.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label-md text-label-md transition-all shadow';
        manualBtn.innerHTML = '<span>Manual</span>';
        autoBtn.className = 'px-3.5 py-1.5 rounded-full text-surface-container-high font-label-md text-label-md hover:text-surface transition-all';
        autoBtn.innerHTML = '<span>Auto</span>';
      }
    }

    let scanCount = 3;
    function triggerCapture() {
      const curtain = document.getElementById('flash-curtain');
      const core = document.getElementById('shutter-core');
      const counter = document.getElementById('batch-counter');

      // Tactile button bounce
      core.classList.add('scale-75');
      setTimeout(() => core.classList.remove('scale-75'), 120);

      // Shutter screen blink
      curtain.classList.remove('opacity-0');
      curtain.classList.add('opacity-90');
      setTimeout(() => {
        curtain.classList.remove('opacity-90');
        curtain.classList.add('opacity-0');
      }, 100);

      // Increment batch page counter
      scanCount += 1;
      counter.textContent = scanCount;
      counter.classList.add('scale-125');
      setTimeout(() => counter.classList.remove('scale-125'), 200);
    }
  </script>
