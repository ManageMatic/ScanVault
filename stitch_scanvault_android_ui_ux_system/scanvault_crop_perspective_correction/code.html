  (function() {
    // Interactive corner dragging micro-state
    const handles = {
      tl: document.getElementById('handle-tl'),
      tr: document.getElementById('handle-tr'),
      br: document.getElementById('handle-br'),
      bl: document.getElementById('handle-bl')

    const midHandles = {
      mt: document.getElementById('handle-mt'),
      mr: document.getElementById('handle-mr'),
      mb: document.getElementById('handle-mb'),
      ml: document.getElementById('handle-ml')
    };

    const poly = document.getElementById('cropPolygon');
    const polyGrid = document.getElementById('cropGrid');
    const polyBorder = document.getElementById('cropBorder');

    const gV1 = document.getElementById('guideV1');
    const gV2 = document.getElementById('guideV2');
    const gH1 = document.getElementById('guideH1');
    const gH2 = document.getElementById('guideH2');

    let coords = {
      tl: { x: 26, y: 32 },
      tr: { x: 284, y: 20 },
      br: { x: 298, y: 385 },
      bl: { x: 14, y: 374 }
    };

    function updateMesh() {
      const ptString = `${coords.tl.x},${coords.tl.y} ${coords.tr.x},${coords.tr.y} ${coords.br.x},${coords.br.y} ${coords.bl.x},${coords.bl.y}`;
      poly.setAttribute('points', ptString);
      polyGrid.setAttribute('points', ptString);
      polyBorder.setAttribute('points', ptString);

      // Recalculate midpoints
      const mt = { x: Math.round((coords.tl.x + coords.tr.x) / 2), y: Math.round((coords.tl.y + coords.tr.y) / 2) };
      const mr = { x: Math.round((coords.tr.x + coords.br.x) / 2), y: Math.round((coords.tr.y + coords.br.y) / 2) };
      const mb = { x: Math.round((coords.bl.x + coords.br.x) / 2), y: Math.round((coords.bl.y + coords.br.y) / 2) };
      const ml = { x: Math.round((coords.tl.x + coords.bl.x) / 2), y: Math.round((coords.tl.y + coords.bl.y) / 2) };

      midHandles.mt.style.left = mt.x + 'px';
      midHandles.mt.style.top = mt.y + 'px';
      midHandles.mr.style.left = mr.x + 'px';
      midHandles.mr.style.top = mr.y + 'px';
      midHandles.mb.style.left = mb.x + 'px';
      midHandles.mb.style.top = mb.y + 'px';
      midHandles.ml.style.left = ml.x + 'px';
      midHandles.ml.style.top = ml.y + 'px';

      // Internal perspective third lines
      gV1.setAttribute('x1', Math.round(coords.tl.x + (coords.tr.x - coords.tl.x) * 0.33));
      gV1.setAttribute('y1', Math.round(coords.tl.y + (coords.tr.y - coords.tl.y) * 0.33));
      gV1.setAttribute('x2', Math.round(coords.bl.x + (coords.br.x - coords.bl.x) * 0.33));
      gV1.setAttribute('y2', Math.round(coords.bl.y + (coords.br.y - coords.bl.y) * 0.33));

      gV2.setAttribute('x1', Math.round(coords.tl.x + (coords.tr.x - coords.tl.x) * 0.66));
      gV2.setAttribute('y1', Math.round(coords.tl.y + (coords.tr.y - coords.tl.y) * 0.66));
      gV2.setAttribute('x2', Math.round(coords.bl.x + (coords.br.x - coords.bl.x) * 0.66));
      gV2.setAttribute('y2', Math.round(coords.bl.y + (coords.br.y - coords.bl.y) * 0.66));

      gH1.setAttribute('x1', Math.round(coords.tl.x + (coords.bl.x - coords.tl.x) * 0.33));
      gH1.setAttribute('y1', Math.round(coords.tl.y + (coords.bl.y - coords.tl.y) * 0.33));
      gH1.setAttribute('x2', Math.round(coords.tr.x + (coords.br.x - coords.tr.x) * 0.33));
      gH1.setAttribute('y2', Math.round(coords.tr.y + (coords.br.y - coords.tr.y) * 0.33));

      gH2.setAttribute('x1', Math.round(coords.tl.x + (coords.bl.x - coords.tl.x) * 0.66));
      gH2.setAttribute('y1', Math.round(coords.tl.y + (coords.bl.y - coords.tl.y) * 0.66));
      gH2.setAttribute('x2', Math.round(coords.tr.x + (coords.br.x - coords.tr.x) * 0.66));
      gH2.setAttribute('y2', Math.round(coords.tr.y + (coords.br.y - coords.tr.y) * 0.66));
    }

    // Touch & Mouse Drag Handlers
    Object.keys(handles).forEach(key => {
      const el = handles[key];
      let isDragging = false;

      function onStart(e) {
        isDragging = true;
        el.classList.add('scale-125');
        e.preventDefault();
      }

      function onMove(e) {
        if (!isDragging) return;
        const workspace = document.getElementById('cropWorkspace').getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        let x = Math.round(clientX - workspace.left);
        let y = Math.round(clientY - workspace.top);

        // Clamp inside workspace
        x = Math.max(0, Math.min(310, x));
        y = Math.max(0, Math.min(410, y));

        coords[key].x = x;
        coords[key].y = y;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        updateMesh();
      }

      function onEnd() {
        if (isDragging) {
          isDragging = false;
          el.classList.remove('scale-125');
        }
      }

      el.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    });

    // Quick Tool Interactions
    const resetBtn = document.getElementById('btnReset');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        coords = { tl: { x: 26, y: 32 }, tr: { x: 284, y: 20 }, br: { x: 298, y: 385 }, bl: { x: 14, y: 374 } };
        Object.keys(handles).forEach(k => {
          handles[k].style.left = coords[k].x + 'px';
          handles[k].style.top = coords[k].y + 'px';
        });
        updateMesh();
      });
    }

    const fitBtn = document.getElementById('btnFit');
    if (fitBtn) {
      fitBtn.addEventListener('click', () => {
        coords = { tl: { x: 8, y: 8 }, tr: { x: 302, y: 8 }, br: { x: 302, y: 402 }, bl: { x: 8, y: 402 } };
        Object.keys(handles).forEach(k => {
          handles[k].style.left = coords[k].x + 'px';
          handles[k].style.top = coords[k].y + 'px';
        });
        updateMesh();
      });
    }

    const autoDetectBtn = document.getElementById('autoDetectBtn');
    if (autoDetectBtn) {
      autoDetectBtn.addEventListener('click', () => {
        coords = { tl: { x: 20, y: 24 }, tr: { x: 290, y: 16 }, br: { x: 304, y: 390 }, bl: { x: 12, y: 380 } };
        Object.keys(handles).forEach(k => {
          handles[k].style.left = coords[k].x + 'px';
          handles[k].style.top = coords[k].y + 'px';
        });
        updateMesh();
      });
    }
  })();
</script></main></body></html>
