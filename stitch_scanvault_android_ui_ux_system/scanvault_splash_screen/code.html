<script>
  (function() {
    const steps = [
      { progress: 28, text: 'Initializing on-device sandbox • 100% Private' },
      { progress: 54, text: 'Verifying cryptographic keystore • Secure' },
      { progress: 82, text: 'Mounting offline database • Zero Telemetry' },
      { progress: 100, text: 'Vault ready • Launching Workspace' }
    ];
    let stepIndex = 0;
    const bar = document.getElementById('splash-progress-bar');
    const text = document.getElementById('splash-status-text');

    if (bar && text) {
      const interval = setInterval(() => {
        stepIndex++;
        if (stepIndex < steps.length) {
          bar.style.width = steps[stepIndex].progress + '%';
          text.textContent = steps[stepIndex].text;
        } else {
          clearInterval(interval);
        }
      }, 700);
    }
  })();
